# Production: https://${DOMAIN} behind a Traefik reverse proxy (external network "web", Let's Encrypt resolver
# "letsencrypt"), itself behind Cloudflare: only Cloudflare addresses are accepted (middleware puzzle-cf).
# Start: docker compose up -d --build   (values in .env, never versioned: see .env.example)
name: puzzle
services:
  puzzle:
    build: { context: ., target: server }
    image: puzzle-server:latest
    container_name: puzzle
    restart: unless-stopped
    user: "${PUZZLE_UID:-1000}:${PUZZLE_GID:-1000}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2000m          # a recalibration photo peaks at ≈ 1.4 GiB with the server running
    pids_limit: 200
    environment:
      PUZZLE_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      PUZZLE_COOKIE_SECURE: "1"
      PUZZLE_PASSWORD_HASH: ${PUZZLE_PASSWORD_HASH:?set PUZZLE_PASSWORD_HASH in .env}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ${PUZZLE_DATA_VOLUME:?set PUZZLE_DATA_VOLUME in .env}:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [web]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.puzzle.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.puzzle.entrypoints=websecure
      - traefik.http.routers.puzzle.tls.certresolver=letsencrypt
      - traefik.http.routers.puzzle.middlewares=puzzle-cf
      - traefik.http.services.puzzle.loadbalancer.server.port=8080
      # Cloudflare addresses only (https://www.cloudflare.com/ips/, to re-read from time to time); Traefik 2: ipwhitelist
      - traefik.http.middlewares.puzzle-cf.ipwhitelist.sourcerange=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
networks:
  web:
    external: true
